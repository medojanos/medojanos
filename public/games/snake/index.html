<!DOCTYPE html>
<html lang="en">
    <head>
		<meta charset="UTF-8"/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
		<link rel="icon" type="icon/x-image" href="img/food.png">
    	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"/>
		<link rel="stylesheet" href="style.css">
		<title>Snake</title>
    </head>
	<body>
		<h1 class="text-center my-4"><a href="">Snake</a></h1>
		<div class="container-fluid">
			<div class="row justify-content-center">
				<div class="col-sm-10 col-md-8 col-lg-6 col-xl-4">
					<canvas id="gameArea" width="500" height="500"></canvas>
					<div class="row text-center my-3">
						<div class="col">
							<select onchange="gridSelect()" id="gridSelect" disabled>
								<option>10x10</option>
								<option selected>15x15</option>
								<option>20x20</option>
							</select>
						</div>
						<div class="col"><button onclick="restartGame()" id="restartButton" disabled>RESTART</button></div>
						<div class="col"><button onclick="loadGame()" id="startButton">START</button></div>
					</div>
					<div id="controls" class="my-5">
						<div class="row justify-content-center">
    						<div class="col-auto"><button onclick="direction('ArrowUp')">↑</button></div>
						</div>
						<div class="row justify-content-center">
    						<div class="col-auto me-4"><button onclick="direction('ArrowLeft')">←</button></div>
    						<div class="col-auto ms-4"><button onclick="direction('ArrowRight')">→</button></div>
						</div>
						<div class="row justify-content-center">
    						<div class="col-auto"><button onclick="direction('ArrowDown')">↓</button></div>
						</div>
					</div>
					<div class="row">
						<div class="col">
							<p>Enter - Játék kezdése<br>W, A, S, D / Arrows - Move<br>R - Restart</p>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="script.js"></script>	
	</body>
</html>
